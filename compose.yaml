# Local stack with the same shape as Azure: the API with profile 'azure' + MySQL 8.4.
#   1. Copy .env.example to .env and choose your own local values (.env is never committed).
#   2. docker compose up --build --wait      (API on http://localhost:8080)
#   3. docker compose down                   (add -v to also delete the database volume)
name: trebol

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trebol
      MYSQL_USER: trebol
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    # TCP on 127.0.0.1 only answers once the real server runs (not the temporary one used during first init)
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # No 'ports': the database is reachable only from the API container, as in Azure (private access)

  api:
    build:
      context: ./trebol-backend-monolith
      args:
        MAVEN_EXTRA_ARGS: ${MAVEN_EXTRA_ARGS:-}
    image: trebol-api:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: azure
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trebol
      SPRING_DATASOURCE_USERNAME: trebol
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TREBOL_SECURITY_JWTSECRETKEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
    # Longer than the app's 30 s graceful shutdown, so requests in progress can finish on 'docker compose stop'
    stop_grace_period: 40s

volumes:
  mysql-data:
