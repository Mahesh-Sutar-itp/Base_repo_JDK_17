############################################################
# AZURE PROFILE: activated with SPRING_PROFILES_ACTIVE=azure
# (Azure Container Apps + Azure Database for MySQL Flexible Server)
# Only the differences from application.properties live here. This file holds NO secrets: environment
# variables (filled from Key Vault in Azure) always take precedence over any properties file.
############################################################
# DATABASE (MySQL 8.4)
## URL, user and password come from SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
## SPRING_DATASOURCE_PASSWORD. The ${...} references below only make a missing variable fail loudly, and the
## driver is pinned to MySQL, so this profile can never silently start the embedded H2 database instead
## (that would give every replica its own private, empty database).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
## Connections per replica: replicas x pool size must stay below the server's max_connections
## (can be changed without a rebuild through SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE)
spring.datasource.hikari.maximum-pool-size=15
##############################
# SCHEMA: Flyway creates and migrates it (classpath:db/migration); Hibernate only checks it at startup
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
## data.sql (with its H2-only lines) never runs on MySQL: the seed data is Flyway's V2
spring.sql.init.mode=never
## Must be false when Flyway is on: deferring would make Flyway and Hibernate wait for each other at startup
spring.jpa.defer-datasource-initialization=false
##############################
# SECURITY
## The JWT signing key must come from TREBOL_SECURITY_JWTSECRETKEY (Key Vault, same value on every replica).
## Empty on purpose: if the variable is missing, startup fails (@NotBlank) instead of silently using the
## public placeholder key from application.properties.
trebol.security.jwt-secret-key=
