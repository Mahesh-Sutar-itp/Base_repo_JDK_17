############################################################
#
# PRODUCTION PROFILE (MariaDB / Amazon RDS)
# Enable with SPRING_PROFILES_ACTIVE=prod. Loaded on top of application.properties.
# Every environment-specific or secret value comes from an environment variable.
# Values without a default (DB_HOST, DB_USERNAME, DB_PASSWORD, JWT_SECRET_KEY) are required:
# the app refuses to start if they are missing, rather than running with a placeholder.
#
##############################
# DATABASE (on AWS, DB_HOST is the RDS Proxy endpoint)
## disableSessionTracking=true: on every new connection the MariaDB driver otherwise runs
##   SET ..., session_track_system_variables = CONCAT(@@global.session_track_system_variables, ...)
## RDS Proxy does not track that variable, so it PINS the connection: one DB connection reserved per
## app connection, no sharing. Load test 3 (5,000 users) showed 10 of 10 proxy connections pinned and
## new tasks failing to start. The sql_mode part of that SET stays; RDS Proxy tracks it without pinning.
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:trebol}?${DB_URL_OPTIONS:disableSessionTracking=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
## Small pool per task: with the read cache most requests need no DB connection, and RDS Proxy shares
## the database's few connections (db.t3.micro allowed the proxy only 10-24) across all tasks.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
## Fixed-size pool (minimum-idle = maximum-pool-size): connections are opened at start-up and kept,
## so a traffic burst doesn't also pay for opening new connections. These are client connections to
## RDS Proxy, which lends a database connection only while a transaction runs, so idle ones are cheap.
## (With a fixed-size pool Hikari ignores idle-timeout.)
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:${DB_POOL_SIZE:3}}
## Recycle connections after 25 min, before RDS Proxy's 30-min idle client timeout (rds.tf) closes them
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1500000}
## How long a request waits for a free DB connection before giving up (then: 503 + Retry-After).
## 5 s: fail fast and free the Tomcat thread instead of letting requests pile up behind a busy pool
## (load test r11171916). Health checks no longer depend on this (see ACTUATOR below).
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
## Logs a warning with a stack trace when a connection is held longer than this (a leak or a slow
## transaction). Off by default (0); set e.g. DB_LEAK_DETECTION_MS=10000 for load-test runs.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}
##############################
# READ CACHE (per task, see org.trebol.config.CacheConfig)
## Public reads repeat a lot; each task keeps them for a short time so DB load stays nearly flat as
## tasks scale out. Changes made through another task show up after at most CACHE_TTL.
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.cache-names=about,billingTypes,productPages
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=${CACHE_TTL:30s}
## Flyway owns the schema; Hibernate must not change it and data.sql must not run
spring.flyway.enabled=true
## Flyway gets its own connection (not one from the pool), closed when migration ends. Flyway takes a
## named lock (GET_LOCK) on MariaDB, which pins the connection at RDS Proxy; a pooled connection would
## stay pinned for its whole life (up to max-lifetime), one per task.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
## Hold a DB connection only while a transaction runs, not for the whole HTTP request.
## With open-in-view on (Spring's default), JSON output, JWT checks and BCrypt hashing kept the
## connection busy; under load the 10-connection pool ran out (HikariPool timeouts, 5xx).
## Safe here: entities are converted to POJOs inside @Transactional services.
spring.jpa.open-in-view=false
##############################
# ACTUATOR on its own port
## Health endpoints run on 8081 with their own small Tomcat connector and threads, so the ALB health
## check never queues behind user requests on 8080. /actuator is no longer served on 8080.
## The ALB checks /actuator/health/liveness on 8081 (no database: see application.properties).
## Port 8081 is reachable only from the ALB (security-groups.tf), and CloudFront forwards to 8080 only.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
##############################
# SECURITY
trebol.security.jwt-secret-key=${JWT_SECRET_KEY}
trebol.security.bcrypt-encoder-strength=${BCRYPT_STRENGTH:10}
trebol.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
##############################
# API DOCS (off in production unless explicitly enabled)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
##############################
# PAYMENTS (Webpay is disabled for the POC; URLs kept configurable)
trebol.payment.webpayplus.production=false
trebol.payment.webpayplus.callback-url=${WEBPAY_CALLBACK_URL:http://localhost:8080/public/checkout/validate}
trebol.payment.webpayplus.browser-redirection-url=${WEBPAY_REDIRECT_URL:http://localhost:4200/store/receipt}
##############################
# LOGGING
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN
