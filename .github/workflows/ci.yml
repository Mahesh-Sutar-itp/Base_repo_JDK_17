# Step 5.2: build and test the backend on every pull request and every push to main.
#
# Needs no AWS access and no secrets, so it is safe for pull requests (including from forks).
# `mvn verify` compiles, runs the tests (Testcontainers uses the Docker that GitHub's Linux
# runners provide), writes the JaCoCo coverage report and enforces the minimum coverage
# set in pom.xml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository
permissions:
  contents: read

# A newer push to the same branch makes the older, still-running build pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: trebol-backend-monolith

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven # keeps ~/.m2 between runs, keyed on pom.xml

      - name: Build, test and check coverage
        run: mvn -B -ntp verify

      - name: Upload test and coverage reports
        if: always() # also when tests fail, that is when the reports matter most
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            trebol-backend-monolith/target/surefire-reports/
            trebol-backend-monolith/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
