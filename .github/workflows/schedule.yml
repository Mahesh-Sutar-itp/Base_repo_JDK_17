# Working-hours schedule (cost rule): everything that can be stopped runs only on weekdays 14:00-22:00 IST.
#   13:45 IST (08:15 UTC) start: MySQL started, then the app gets a revision with 1 minimum replica.
#   22:00 IST (16:30 UTC) stop:  the app gets a revision with 0 minimum replicas, then MySQL is stopped.
# Weekends stay off. A manual run (start or stop) covers work outside the window; GitHub may start cron runs late.
name: schedule

on:
  schedule:
    - cron: '15 8 * * 1-5'
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: Start or stop the database and the app
        type: choice
        options:
          - start
          - stop
        required: true

permissions:
  contents: read
  id-token: write

# Never at the same time as a deployment
concurrency:
  group: azure-trebol-api
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RESOURCE_GROUP: rg-trebol-poc
  APP_NAME: trebol-api
  MYSQL_SERVER: mysql-trebol-poc-si-ttuu
  DAY_MIN_REPLICAS: '1'

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start or stop?
        id: what
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then action="$INPUT_ACTION"
          elif [ "$CRON" = "15 8 * * 1-5" ]; then action=start
          else action=stop; fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "### Schedule: $action" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start (database first, then the app)
        if: steps.what.outputs.action == 'start'
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          source .github/scripts/aca-revision.sh
          state=$(az mysql flexible-server show --resource-group "$RESOURCE_GROUP" --name "$MYSQL_SERVER" --query state --output tsv)
          echo "MySQL state: $state"
          if [ "$state" = "Stopped" ]; then
            az mysql flexible-server start --resource-group "$RESOURCE_GROUP" --name "$MYSQL_SERVER" --output none
            echo "MySQL started"
          fi
          aca_set_min_replicas "$DAY_MIN_REPLICAS" "on-$(date -u +%m%d%H%M)"
          echo "Started: MySQL running, app minimum $DAY_MIN_REPLICAS replica(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop (app first, then the database)
        if: steps.what.outputs.action == 'stop'
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          source .github/scripts/aca-revision.sh
          aca_set_min_replicas 0 "off-$(date -u +%m%d%H%M)"
          state=$(az mysql flexible-server show --resource-group "$RESOURCE_GROUP" --name "$MYSQL_SERVER" --query state --output tsv)
          echo "MySQL state: $state"
          if [ "$state" = "Ready" ]; then
            az mysql flexible-server stop --resource-group "$RESOURCE_GROUP" --name "$MYSQL_SERVER" --output none
            echo "MySQL stopped"
          fi
          echo "Stopped: app scaled to zero, MySQL stopped" >> "$GITHUB_STEP_SUMMARY"
