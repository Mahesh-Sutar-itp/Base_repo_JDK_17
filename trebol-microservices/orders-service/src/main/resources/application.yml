# orders-service
# Each service owns its schema exclusively - no service reads another's tables.
server:
  port: 8083

spring:
  application:
    name: orders-service
  datasource:
    # In-memory by default, matching the monolith's runtime default.
    # Point at MariaDB per environment. Credentials MUST come from the environment,
    # never from a committed file (guardrail G7).
    url: ${TREBOL_ORDERS_DB_URL:jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1}
    username: ${TREBOL_ORDERS_DB_USER:sa}
    password: ${TREBOL_ORDERS_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

trebol:
  security:
    # Shared signing key - every service verifies locally; only identity-service issues.
    # Supplied by the environment; no default, on purpose.
    jwt-secret-key: ${TREBOL_JWT_SECRET_KEY:}
