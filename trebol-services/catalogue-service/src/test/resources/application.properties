############################################################
#
# TEST FIXTURE - not deployment configuration.
#
# This file exists so the context-load test can start the application without any environment
# variable being set. Everything here is throwaway: an in-memory H2 database that disappears with
# the JVM, and a dummy signing key that signs nothing (this service issues no tokens; it only
# verifies them, and no test presents a token signed with this value).
#
# The deployment configuration in src/main/resources/application.properties contains NO secret and
# no default for any sensitive value - see G7 and exit criterion X10.
#
############################################################
server.port=0
spring.application.name=trebol-catalogue-service

spring.jackson.default-property-inclusion=non_default
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

trebol.api.items-per-page=10
trebol.api.max-allowed-page-size=1000
trebol.api.max-category-fetching-recursion-depth=20

# Dummy, test-only. Long enough to satisfy the HMAC-SHA key-length requirement.
trebol.security.jwt-secret-key=TEST.ONLY.KEY.NOT.A.SECRET.DO.NOT.USE.ANYWHERE.ELSE.0123456789
trebol.security.jwt-expiration-after-minutes=30
trebol.security.jwt-expiration-after-hours=0
trebol.security.jwt-expiration-after-days=0
trebol.security.bcrypt-encoder-strength=10

trebol.cors.list-delimiter=;
trebol.cors.allowed-headers=Content-Type;Accept;X-Requested-With;Authorization
trebol.cors.allowed-origins=http://localhost:4200
trebol.cors.mappings=\
GET /public/about;\
GET,POST,PUT,DELETE /data/images;\
GET,POST,PUT,DELETE /data/products;\
GET,POST,PUT,DELETE /data/product_lists;\
GET,POST,PUT,DELETE /data/product_list_contents;\
GET,POST,PUT,DELETE /data/product_categories

# In-memory H2. The schema comes from Hibernate, exactly as it does for the monolith's own tests:
# schema-mariadb.sql is only loaded when spring.sql.init.platform=mariadb.
spring.datasource.url=jdbc:h2:mem:catalogue-test
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.defer-datasource-initialization=true

logging.charset.file=UTF-8
