############################################################
#
# TEST FIXTURE - not deployment configuration.
#
# This file exists so the context-load test and every ported test can start the application with
# no environment variable set. Everything here is throwaway: an in-memory H2 database that
# disappears with the JVM, and a dummy signing key.
#
# The deployment configuration in src/main/resources/application.properties contains NO secret and
# no default for any sensitive value - see invariant G7 and exit criterion X10.
#
# IMPORTANT, and the reason three tests failed when this file was first ported: a file named
# application.properties in test resources SHADOWS the one in main resources entirely - unlike
# data.sql, whose default location is a `classpath*:` wildcard that loads both copies. So every
# property any @Validated @ConfigurationProperties bean needs must be repeated here, even one this
# service never reads. The validated beans in this module, and what each requires, are:
#   trebol.api                   - three @Positive fields
#   trebol.cors                  - four @NotBlank fields
#   trebol.security              - @NotBlank key, @PositiveOrZero expiries, @Min(6) bcrypt strength
#   trebol.payment.webpayplus    - @NotBlank callback-url and browser-redirection-url
# trebol.services (the sibling-service endpoints) is NOT validated and carries code defaults, so
# it is deliberately absent: no test makes a real call, and a wrong URL here would be a trap.
#
############################################################
server.port=0
spring.application.name=trebol-orders-service

spring.jackson.default-property-inclusion=non_default
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

trebol.api.items-per-page=10
trebol.api.max-allowed-page-size=1000
## Not used by this service - there is no category tree here - but ApiProperties is a @Validated
## bean and the field is @Positive on a primitive int, so the context cannot start without it.
## Carried over at the monolith's value rather than invented.
trebol.api.max-category-fetching-recursion-depth=20

# This service VERIFIES tokens and never issues them (ADR-002), so the key below only has to be a
# valid HMAC-SHA key - nothing in this module signs with it. Dummy, test-only.
trebol.security.jwt-secret-key=TEST.ONLY.KEY.NOT.A.SECRET.DO.NOT.USE.ANYWHERE.ELSE.0123456789
trebol.security.jwt-expiration-after-minutes=30
trebol.security.jwt-expiration-after-hours=0
trebol.security.jwt-expiration-after-days=0
## SecurityProperties is shared-kernel code, so these fields exist here even though the verify-only
## SecurityConfig in this module has no password encoder, no login route and no guest filter.
## bcrypt-encoder-strength is @Min(6) and must therefore be present and valid.
trebol.security.bcrypt-encoder-strength=10
trebol.security.guest-user-enabled=false
trebol.security.guest-user-name=guest
trebol.security.guest-user-role-id=4
trebol.security.account-protection-enabled=true
trebol.security.protected-account-id=1

trebol.cors.list-delimiter=;
trebol.cors.allowed-headers=Content-Type;Accept;X-Requested-With;Authorization
trebol.cors.allowed-origins=http://localhost:4200
## The six route surfaces this service owns. The ported copy of this file still listed the Identity
## service's routes (/data/users, /data/user_roles, /public/login), which this module does not serve.
trebol.cors.mappings=\
GET /public/receipt/*;\
POST /public/checkout;\
GET,POST /public/checkout/validate;\
GET,POST,PUT,DELETE /data/orders;\
GET,POST,PUT,DELETE /data/billing_types;\
GET,POST,PUT,DELETE /data/billing_companies;\
GET,POST,PUT,DELETE /data/shippers;\
GET,POST,PUT,DELETE /data/order_statuses

# Webpay Plus. Both URLs are @NotBlank, so the context cannot start without them - this is what
# the three OrderStatusPatchPersistenceProbeTest errors were. The values are deliberately
# unroutable: no test performs a real Transbank call, and the adapter tests inject a stub
# transaction factory (register item D18).
trebol.payment.webpayplus.production=false
trebol.payment.webpayplus.commerce-code=597055555532
trebol.payment.webpayplus.api-key=test-only-not-a-real-key
trebol.payment.webpayplus.callback-url=http://localhost/public/checkout/validate
trebol.payment.webpayplus.browser-redirection-url=http://localhost/receipt

# In-memory H2. The schema comes from Hibernate, exactly as it does for the monolith's own tests:
# schema-mariadb.sql is only loaded when spring.sql.init.platform=mariadb.
#
# Seed data is left at Spring Boot's default location, `optional:classpath*:data.sql`, which picks
# up this module's own src/main/resources/data.sql - the 12 order statuses, 2 billing types and 1
# payment type. There is deliberately no test-only seed here: unlike Identity, this service's
# deployment seed contains no accounts and no credentials, so there is nothing to substitute.
# (The ported copy of this file pinned spring.sql.init.data-locations to a data-test.sql that was
# Identity's and does not exist in this module - it would have failed the moment a test reached
# datasource initialisation.)
spring.datasource.url=jdbc:h2:mem:orders-test
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.defer-datasource-initialization=true

logging.charset.file=UTF-8
