############################################################
#
# Identity service configuration.
#
# NO SECRET APPEARS IN THIS FILE, and none may be added to it. That is invariant G7 of the
# conversion and exit criterion X10: the monolith keeps its JWT signing key and its database
# credentials in committed configuration, and that mistake is explicitly not replicated.
#
# It matters more here than anywhere else. This is the ONLY service that SIGNS tokens, so the
# signing key committed in this file would be a key that mints valid credentials for every other
# service, not merely one that verifies them.
#
# Every sensitive value is read from the environment with no default. An unset variable fails the
# application at startup rather than silently falling back to something insecure - and for the
# signing key in particular an empty value cannot start at all, because
# SecurityProperties.jwtSecretKey is @NotBlank on a @Validated bean, and Keys.hmacShaKeyFor
# additionally rejects anything shorter than 256 bits.
#
# Test-only values live in src/test/resources/application.properties. That file is a test fixture,
# not deployment configuration.
#
############################################################
# GENERAL SERVER & SPRING CONFIGURATION
server.port=${TREBOL_IDENTITY_PORT:8082}
spring.application.name=trebol-identity-service
# Ported verbatim from the monolith: the serialization policy is part of the response contract.
spring.jackson.default-property-inclusion=non_default
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false
##############################
# GENERAL APPLICATION CONFIGURATION
## Default amount of items per page in GET requests (when no page size is specified)
trebol.api.items-per-page=10
## Maximum allowed amount of items per page in GET requests (higher numbers than this are truncated)
trebol.api.max-allowed-page-size=1000
## Not used by this service - there is no category tree here - but ApiProperties is a @Validated
## bean and the field is @Positive on a primitive int, so the context cannot start without it.
## Carried over at the monolith's value rather than invented.
trebol.api.max-category-fetching-recursion-depth=20
##############################
# SECURITY
## The shared signing key. This service SIGNS with it; every other service only verifies with it
## locally (ADR-002). Supplied by the environment; there is deliberately no default.
trebol.security.jwt-secret-key=${TREBOL_JWT_SECRET_KEY}
## Token lifetime is the SUM of these three components, not a precedence choice (BR-USER-017).
## Unlike catalogue-service, this service actually uses them - it is the issuer.
trebol.security.jwt-expiration-after-minutes=30
trebol.security.jwt-expiration-after-hours=0
trebol.security.jwt-expiration-after-days=0
## The BCrypt (logarithmic) encoding strength. Actually used here: this service owns the password
## store and the PasswordEncoder bean (BR-USER-013). Values carried over from the monolith.
trebol.security.bcrypt-encoder-strength=10
## Whether to enable customers to use a limited guest account, whose only API permission is to checkout
trebol.security.guest-user-enabled=false
## The name (and password) of the guest account.
## The name IS the credential - register item D14 remainder (a), ruled PRESERVE. See
## defect-register-rulings.md; this is a credential/product decision, not conversion work.
trebol.security.guest-user-name=guest
## The role id of the guest account
trebol.security.guest-user-role-id=4
## Whether to enable account protection. Protected account cannot be deleted
trebol.security.account-protection-enabled=true
## The id of the account that needs to be protected. Default is 1
trebol.security.protected-account-id=1
##############################
# VALIDATION
## Regular expressions used by RegexMatcherAdapterService and the @PhoneNumber validator.
## Ported verbatim from the monolith: they decide which input is accepted, so they are behaviour.
## Both are @NotBlank on a @Validated bean, so the application will not start without them.
trebol.validation.id-number-regexp=^\d{7,9}[\dk]$
trebol.validation.phonenumber-regexp=^\\+(?:[0-9] ?){6,14}[0-9]$
##############################
# CORS
## Value delimiter for other CORS-related properties
trebol.cors.list-delimiter=;
## Headers that are allowed and exposed in the CORS policy
trebol.cors.allowed-headers=Content-Type;Accept;X-Requested-With;Authorization
## Origins allowed by the CORS policy. Supplied by the environment - the monolith's committed
## localhost origins are a development convenience, not a deployment setting.
trebol.cors.allowed-origins=${TREBOL_CORS_ALLOWED_ORIGINS}
## Only this service's own route surfaces, carried over from the monolith's register verbatim.
## /public/login and /public/guest are filter-processed URLs, not controller mappings, but they
## still need a CORS entry because a browser preflights them like any other cross-origin POST.
trebol.cors.mappings=\
POST /public/login;\
POST /public/guest;\
POST /public/register;\
GET,PUT /account/profile;\
GET /access;\
GET /access/*;\
GET /data/people;\
GET,POST,PUT,DELETE /data/customers;\
GET,POST,PUT,DELETE /data/salespeople;\
GET,POST,PUT,DELETE /data/users;\
GET,POST,PUT,DELETE /data/user_roles;\
GET,PUT,DELETE /data/customers/*;\
GET,PUT,DELETE /data/salespeople/*;\
GET,PUT,DELETE /data/users/*;\
GET,PUT,DELETE /data/user_roles/*
##############################
# DATABASE CONNECTION
## Supplied entirely by the environment. This service owns seven tables exclusively -
## people, app_users, app_user_roles, app_permissions, app_user_role_permissions, customers,
## salespeople - and must be pointed at its own schema, never at a shared one.
spring.datasource.url=${TREBOL_IDENTITY_DB_URL}
spring.datasource.username=${TREBOL_IDENTITY_DB_USER}
spring.datasource.password=${TREBOL_IDENTITY_DB_PASSWORD}
spring.jpa.defer-datasource-initialization=true
##############################
# LOGGING
logging.charset.file=UTF-8
